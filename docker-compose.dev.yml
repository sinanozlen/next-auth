# Docker Compose version 3.8

services:
  next-auth-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: next-auth-dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DISABLE_ESLINT_PLUGIN=true
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
    networks:
      - next-auth-dev-network

networks:
  next-auth-dev-network:
    driver: bridge 