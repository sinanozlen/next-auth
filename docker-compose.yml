# Docker Compose version 3.8

services:
  # Development service
  next-auth-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: next-auth-dev
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
    networks:
      - next-auth-network

  # Production service
  next-auth-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-auth-prod
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - next-auth-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: next-auth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - next-auth-prod
    restart: unless-stopped
    networks:
      - next-auth-network
    profiles:
      - production

networks:
  next-auth-network:
    driver: bridge 